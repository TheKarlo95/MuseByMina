name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # Swap these for SITE=https://muse.dance BASE=/ once the domain is live.
        env:
          SITE: https://thekarlo95.github.io
          BASE: /MuseByMina
          # The Formspark endpoint for the trial-class form (MUSE-7). The form id ships
          # inside every page, so this is a repository *variable*, not a secret — but it
          # is still not committed, so the form can be repointed without a code change.
          # Set it at Settings → Secrets and variables → Actions → Variables:
          #   PUBLIC_FORM_ENDPOINT = https://submit-form.com/<form-id>
          # Until it is set the form renders and validates, but reports that it could not
          # deliver and offers the studio inbox instead.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          # Which Sanity project and dataset this build reads content from (MUSE-19).
          # Repository *variables*, not secrets: the dataset is publicly readable by
          # design and both ids travel in the URL of every request. There is deliberately
          # **no read token** — one more secret to rotate and leak, protecting content
          # that is published on the public web anyway.
          #   SANITY_PROJECT_ID = q6fk9usq
          #   SANITY_DATASET    = production
          # Both have defaults in `src/lib/sanity/client.ts`, so an unset variable builds
          # against the live dataset rather than failing. No page reads Sanity yet —
          # MUSE-20 is the migration — so today this changes nothing about the output.
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
