name: CI

on:
  pull_request:
  push:
    branches: [main]

# Agent-authored PRs push repeatedly; cancel superseded runs rather than queue them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm test` drives a real browser for the trial form (test/contact.test.ts).
      - run: npx playwright install --with-deps chromium
      # `astro check` is inside `npm run build` now, not a step beside it. That is
      # deliberate and it is about `deploy.yml`, not about this job: `deploy.yml` runs
      # `npm run build` and nothing else, and does not depend on CI, so anything that is
      # only a CI step is not on the path to production. A field *type* change and a
      # projection typo are caught by `astro check` alone — see README, "What 'fails the
      # build' means". Running it here as well would buy a prettier step name for the
      # same nine seconds.
      - run: npm run build
      # Builds the site twice more, under two different SITE/BASE targets.
      - run: npm test
      - name: Guard the GitHub Pages 1 GB site limit
        run: |
          size=$(du -sm dist | cut -f1)
          echo "dist is ${size} MB"
          if [ "$size" -gt 900 ]; then
            echo "::error::dist is ${size} MB — approaching the 1 GB Pages limit. Media belongs on a CDN, not in the repo."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  a11y:
    name: accessibility (both themes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # No server to start. Both checks serve `dist` themselves, from an in-process host
      # on a port the kernel picks (MUSE-52) — `astro preview` daemonises under the agent
      # environment and silently reuses a daemon on another port, so a check pointed at
      # one can audit a different worktree's build and report it clean. That cannot happen
      # on a fresh runner, but leaving the daemon here would mean the audited origin is a
      # daemon again the next time this job is copied, and the scripts no longer have a
      # port to be handed. Each check logs the fingerprint of the build it measured.
      #
      # No route list either. `npm run a11y` reads the set off the build it just made
      # (MUSE-55) — every HTML file in `dist`, each at the URL the host serves it and the
      # status the host answers, so the error page is audited in both locales and a new
      # page under `src/pages/` is audited the day it builds. The list that used to live
      # here said "adding a page → add it", which is this repository's seventh instance of
      # a hand-extended list, and it never contained the 404 at all because the 404 cannot
      # be reached at the spelling a route list produces.
      - name: Audit
        run: |
          npm run a11y
          # /schedule's responsive shift, keyboard operation and filters —
          # the MUSE-6 criteria a DOM-only test cannot reach.
          npm run ux:schedule

  sanity:
    name: sanity schema & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The Studio's own opinion of the schema. Stricter than extraction, and the
      # cheapest place to catch a malformed type definition.
      - name: Validate the schema
        run: npx sanity schema validate
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}

      # Regenerate `sanity/schema.json` and `src/lib/sanity/sanity.types.ts` from the
      # schema source and fail if either differs from what is committed.
      #
      # `npm run build` already refuses to run with stale artefacts, by comparing a
      # fingerprint of the schema sources (`scripts/check-sanity.mjs`) — that is the fast
      # gate, and it is the one that catches the ordinary case of editing a schema and
      # forgetting to regenerate. This is the slow gate behind it, and it catches the
      # case the fingerprint cannot: artefacts that were hand-edited, or a stamp that was
      # refreshed without regenerating. Between them, the types in the repo cannot
      # describe a schema that does not exist.
      - name: Regenerate and diff
        run: |
          npm run sanity:types
          if ! git diff --exit-code -- sanity/schema.json sanity/schema.stamp.json src/lib/sanity/sanity.types.ts; then
            echo "::error::The Sanity schema changed but the generated artefacts were not regenerated. Run 'npm run sanity:types' and commit sanity/schema.json, sanity/schema.stamp.json and src/lib/sanity/sanity.types.ts."
            exit 1
          fi
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}

      # Actually bundle the Studio.
      #
      # This step exists because every other check in this file passed while the Studio
      # was unbuildable. `sanity schema extract` and `sanity schema validate` evaluate the
      # schema but never bundle it, so neither of them noticed that `styled-components` —
      # a peer dependency of `sanity`, present in `node_modules`, absent from
      # `package.json` — failed Sanity's declaration preflight. `studio.yml` would have
      # found it, on `main`, after merge, as a red deploy and no Studio for Mina.
      #
      # So the bundle is built on every pull request, with no token and no deploy. It is
      # the only check here that answers "can Mina be given a Studio at all".
      - name: Build the Studio
        run: npm run sanity:build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}

      # `sanity build` defaults its output to `dist/`, which is Astro's and which
      # `deploy.yml` uploads to GitHub Pages wholesale. The npm script names
      # `.sanity/studio` instead; this asserts the script, not the default, is what ran —
      # nothing in this job builds the site, so a `dist/` here came from the Studio.
      - name: The Studio must not write where the site is published from
        run: |
          test ! -e dist || { echo "::error::sanity build wrote dist/ — the Studio bundle would be published to GitHub Pages."; exit 1; }
          test -f .sanity/studio/index.html

      # Every query in `src/lib/sanity/queries.ts`, run against the live dataset, each
      # reported as OK / EMPTY / BROKEN. Reads only — the dataset is publicly readable and
      # no token is involved, so there is nothing here that could change content.
      #
      # Most of the dataset is still empty (MUSE-36), so most queries legitimately answer
      # with nothing; the point of running it is that "answered with nothing" and "did not
      # parse" are different lines of output — and that the two MUSE-20 seeded, the
      # `siteSettings` singleton and the `page` documents, answer with content.
      #
      # `continue-on-error` so this step's own flakiness cannot fail a pull request. It
      # used to say that meant "a Sanity outage must not block a pull request that does
      # not touch Sanity", and since MUSE-20 **that is no longer true and cannot be**: the
      # pages read their titles from the dataset at build time, so `npm run build` — in
      # the `check` job above, in the `a11y` job below, and in `deploy.yml` — fails if the
      # API is unreachable. A Sanity outage therefore blocks every pull request and every
      # deploy.
      #
      # That is the deliberate trade: the alternative is publishing pages with empty
      # titles, and `src/lib/sanity/decode.ts` exists to refuse exactly that. Note it is
      # a real availability dependency with no retry or backoff of our own — whatever
      # `@sanity/client` does by default is all there is. If it starts costing time,
      # MUSE-21's rebuild loop is where a cached last-good snapshot would belong.
      - name: Probe the live read path
        continue-on-error: true
        run: npm run sanity:read

      # Does the live dataset still say what `content/seed.ndjson` says? The seed
      # is the test fixture, so when Mina edits in the Studio the suite starts asserting
      # against content that is no longer what the site publishes. Nothing is broken when
      # that happens — the deploy fetches live — but the fixture ages, and this repo's own
      # standard is that a command nobody is reminded of does not get run.
      #
      # `continue-on-error` for the same reason as the probe above, and one more: drift is
      # information, not a defect. A pull request that has nothing to do with content must
      # not go red because somebody reworded a title this morning.
      - name: Is the seed still what the dataset holds?
        continue-on-error: true
        run: npm run sanity:seed:check
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}

  designsystem:
    name: design-system compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-tokens.mjs

  # The one MUSE-21 failure mode that no alert inside the deploy workflow can reach.
  #
  # **GitHub disables a scheduled workflow after 60 days of repository inactivity**, and its
  # documentation promises nothing about telling anyone when it does — the `schedule` event
  # reference states the rule and is silent on notification. A disabled workflow does not
  # fail; it does not run. So `deploy.yml`'s `alert` job, which is the answer to every other
  # way the rebuild loop can break, is structurally blind to this one: there is no run in
  # which to execute it. For a studio site that can go quiet over a summer, that is the
  # rebuilds stopping with nothing red anywhere, and Mina's publishes silently going nowhere
  # — the exact outcome the ticket was written to prevent.
  #
  # Synthetic activity was the obvious fix and was rejected. A bot commit or a weekly
  # Dependabot schedule to keep the clock from expiring rests on an undocumented reading of
  # what GitHub counts as "repository activity"; it would look like a guard, be impossible
  # to test, and this repository has already been bitten twice by guards that only appeared
  # to work. What *is* documented is the workflow's `state` field, which reads
  # `disabled_inactivity` in precisely this case — so this detects the condition instead of
  # betting on preventing it.
  #
  # `ci.yml` is the right host because it is the only workflow here that is **not**
  # scheduled and therefore cannot be auto-disabled itself. It runs on every pull request
  # and every push to `main`, which means the first thing anyone does after a quiet stretch
  # reports this — before a merge, rather than after a deploy that never happened. Note that
  # the disable takes the whole workflow with it, push-triggered deploys included, so this
  # also catches "my merge did not deploy" before it is confusing.
  #
  # It fails rather than warns: re-enabling is one click, and a warning annotation in a
  # green run is not something anybody reads. An unreadable API is a warning, not a
  # failure — "we could not tell" must not block a pull request.
  #
  # Its own job, with its own token: a one-call probe has no business holding `contents:
  # read`, and a `permissions:` block on the build job would have to be widened for every
  # action in it.
  rebuildloop:
    name: the rebuild loop is still enabled
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Is the scheduled rebuild still enabled?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # On a failed request `gh api` writes the error *body* to stdout and only the
          # one-line summary to stderr, so `$( … )` captures a blob of JSON rather than
          # nothing. Taken from the exit code instead — and then shape-checked, because a
          # state is a bare identifier and anything else means the API did not answer with
          # one. The first version of this step read the body as the state and reported a
          # 404 as "unexpected state", which is the API being unreachable turned into a
          # failed pull request: exactly the thing the comment above says must not happen.
          if ! state="$(gh api "/repos/${REPO}/actions/workflows/deploy.yml" --jq '.state' 2>/dev/null)"; then
            state=''
          fi
          case "$state" in
            '' | *[^a-z_]*) state='' ;;
          esac
          echo "deploy.yml state: ${state:-<unreadable>}"
          case "$state" in
            active)
              ;;
            disabled_inactivity)
              echo "::error::The deploy workflow has been disabled after 60 days of repository inactivity, so the site has stopped rebuilding from Sanity and pushes to main are not deploying either. Re-enable it: Actions → Deploy to GitHub Pages → ··· → Enable workflow, then run it once by hand. Notifications for a scheduled workflow move to whoever re-enables it, so expect that to be you from now on."
              exit 1
              ;;
            disabled_manually)
              echo "::error::The deploy workflow is disabled. If that was deliberate, say so in the pull request; if not, re-enable it at Actions → Deploy to GitHub Pages → ··· → Enable workflow. While it is off, nothing Mina publishes reaches the site."
              exit 1
              ;;
            '')
              echo "::warning::Could not read the deploy workflow's state from the API, so whether the rebuild loop is still enabled is unknown. Not failing on it — check Actions → Deploy to GitHub Pages by hand if this persists."
              ;;
            *)
              echo "::error::The deploy workflow is in an unexpected state (${state}). Anything other than 'active' means the site is not rebuilding."
              exit 1
              ;;
          esac
